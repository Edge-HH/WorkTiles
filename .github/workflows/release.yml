name: 📦 构建与发布

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号，例如 1.2.3（手动运行只生成产物，不创建 Release）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: 🏷️ 解析并校验版本号
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME.TrimStart('v', 'V') } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须使用 major.minor.patch 格式，例如 1.2.3。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 📥 获取集控服务端代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Edge-HH/WorkTilesServer
          path: WorkTilesServer
          # 固定到与本次发版测试过的服务端版本，服务端仓库更新协议后同步改这里；
          # 不固定的话服务端 main 的改动会让发版流水线里的同步测试随时挂掉。
          # ci-desktop-sync 分支：服务端 Shared 与桌面端对齐的快照（暂不含桌面端未落地的 WidgetProfile）。
          ref: 95318321ee020ae7e9dd7111d958de55c81b621b

      - name: 🧪 集控同步测试
        shell: pwsh
        run: |
          dotnet run --project ./tests/SyncLogic/SyncLogic.csproj -c Release --nologo -p:WorkTilesServerDir=$PWD/WorkTilesServer/
          if ($LASTEXITCODE -ne 0) { throw "集控同步测试失败。" }

      - name: 🛡️ 依赖漏洞扫描
        shell: pwsh
        run: |
          dotnet list .\src\WorkTiles\WorkTiles.csproj package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { throw "依赖漏洞扫描失败。" }

      - name: 🔒 校验捆绑的 7za.exe
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\src\WorkTiles\Tools\7zip\x64\7za.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'edbee35370e14030e4c785cf88200f42dc651c1eb4217c1e3963c38a12f099b0') {
            throw "7za.exe SHA-256 不匹配：$hash"
          }

      - name: 📦 生成自带运行环境的程序
        shell: pwsh
        run: |
          dotnet publish .\src\WorkTiles\WorkTiles.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:EnableUiVerification=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -o .\artifacts\publish `
            --nologo

      - name: 🪶 精简多余语言资源
        shell: pwsh
        run: .\installer\Optimize-Publish.ps1 -PublishDirectory .\artifacts\publish

      - name: 🗜️ 压缩便携版程序
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\WorkTiles-win-x64-${{ steps.version.outputs.version }}.zip `
            -CompressionLevel Optimal

      - name: 🚀 验证成品启动
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .\artifacts\WorkTiles-win-x64-${{ steps.version.outputs.version }}.zip -DestinationPath .\artifacts\package-check
          .\tests\verify-release-startup.ps1 -PublishDirectory .\artifacts\package-check

      - name: 📤 上传便携版产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WorkTiles-win-x64-${{ steps.version.outputs.version }}
          path: .\artifacts\WorkTiles-win-x64-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: 🎉 创建 GitHub 正式发布
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create $env:REF_NAME `
            .\artifacts\WorkTiles-win-x64-${{ steps.version.outputs.version }}.zip `
            --repo $env:REPO `
            --verify-tag `
            --generate-notes `
            --title "WorkTiles $env:REF_NAME"


  test-logic:
    runs-on: windows-latest
    steps:
      - name: 📥 获取项目代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 🛠️ 配置 .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: 🧪 逻辑测试
        shell: pwsh
        run: |
          dotnet run --project ./tests/ProjectLogic/ProjectLogic.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "ProjectLogic 失败。" }
          dotnet run --project ./tests/SettingsLogic/SettingsLogic.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "SettingsLogic 失败。" }
          dotnet run --project ./tests/UpdateLogic/UpdateLogic.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "UpdateLogic 失败。" }

      - name: 📐 契约脚本
        shell: pwsh
        run: |
          foreach ($script in @(
            'verify-requested-ui-contract.ps1',
            'verify-color-formatting-contract.ps1',
            'verify-rich-text-roundtrip.ps1',
            'verify-interaction-contract.ps1',
            'verify-icon-font-contract.ps1')) {
            & "./tests/$script"
            if ($LASTEXITCODE -ne 0) { throw "$script 失败。" }
          }
